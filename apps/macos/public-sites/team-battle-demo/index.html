<body>
<div class="app" id="app">

  <header class="hud">
    <div class="hud-item">
      <span class="hud-label">得分</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">最高分</span>
      <span class="hud-value" id="best">0</span>
      <span class="hud-note" id="best-note" hidden>最高分：本次会话</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">状态</span>
      <span class="hud-value" id="status" role="status" aria-live="polite">待开始</span>
    </div>
  </header>

  <main class="board-wrap" id="board-wrap">
    <div class="board-box" id="board-box">
      <canvas id="board" width="400" height="400" aria-label="贪吃蛇棋盘">贪吃蛇在线试玩：使用方向键或屏幕方向按钮控制，支持慢、中、快三种难度；需要支持 Canvas 的浏览器。</canvas>
      <div class="overlay" id="overlay" data-mode="none" hidden>
        <div class="overlay-panel">
          <p class="overlay-title" id="overlay-title" hidden></p>
          <p class="overlay-text" id="overlay-text" hidden></p>
          <p class="overlay-lines" id="overlay-lines" hidden></p>
          <button type="button" class="btn btn-primary" id="overlay-btn" hidden>再来一局</button>
        </div>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    </div>
    <p class="notice" id="notice" role="status" hidden>窗口过小，建议放大窗口（宽 ≥ 250 px）</p>
  </main>

  <footer class="controls">
    <label class="field" for="difficulty">难度
      <select id="difficulty" name="difficulty">
        <option value="slow">慢</option>
        <option value="normal" selected>中</option>
        <option value="fast">快</option>
      </select>
    </label>
    <button type="button" class="btn" id="btn-pause">暂停</button>
    <button type="button" class="btn" id="btn-restart">再来一局</button>

    <div class="dpad" id="dpad" role="group" aria-label="方向控制">
      <button type="button" class="pad pad-up" data-dir="up" aria-label="上">▲</button>
      <button type="button" class="pad pad-left" data-dir="left" aria-label="左">◀</button>
      <button type="button" class="pad pad-down" data-dir="down" aria-label="下">▼</button>
      <button type="button" class="pad pad-right" data-dir="right" aria-label="右">▶</button>
    </div>
  </footer>

</div>

<section class="demo-info" aria-labelledby="demo-title">
  <h1 id="demo-title">贪吃蛇在线试玩</h1>
