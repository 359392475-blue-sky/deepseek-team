location = /team-battle-downloads { return 308 https://lowpower.me/team-battle-downloads/; }
location ^~ /team-battle-downloads/ {
    # Match the original browser URI, not nginx internal index resolution.
    if ($request_uri ~ "^/team-battle-downloads/index[.]html([?].*)?$") { return 308 https://lowpower.me/team-battle-downloads/; }
    sub_filter '</head>' '<script defer src="/__metrics/site.js"></script></head>';
    sub_filter_once on;
    sub_filter_last_modified off;

    if ($scheme = http) { return 308 https://lowpower.me$request_uri; }
    alias /www/wwwroot/team-battle-downloads/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
