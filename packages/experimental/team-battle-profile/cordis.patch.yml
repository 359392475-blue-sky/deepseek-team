# Private Team Battle project layer. Apply after dsh-base so the shared
# storage-domain service is available before this project domain opens.

- insert:
    - id: team-battle
      name: '@deepseek-ai/dsh-experimental-team-battle'
      config:
        projectId: lowpower-team-battle
        projectName: DeepSeek Harness 团战版
        projectGoal: 让三至四名成员与各自 Codex 围绕同一项目共享经过确认的 Context、任务与产物。
        localMemberId: product
        storageLocation: !!js dshHomePath('storages')
        members:
          - id: product
            name: 蓝天
            role: 产品
            color: '#4176e6'
          - id: engineering
            name: 研发
            role: 研发
            color: '#27a276'
          - id: quality
            name: 测试
            role: 测试
            color: '#d88434'
          - id: design
            name: UI
            role: UI
            color: '#8a6be8'
        maxTasks: 128
        maxContextEntries: 256
        maxArtifacts: 256
        maxActivityEntries: 512
        maxProcessedEventIds: 2048
        maxWeaponGrants: 2048
        memberOfflineAfterMs: 60000
        shieldDamagePerQuery: 3
